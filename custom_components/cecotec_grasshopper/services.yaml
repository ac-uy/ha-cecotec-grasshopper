start_border_mowing:
  name: Start border mowing
  description: Start the mower in border/edge mowing mode
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity to control
      required: true
      selector:
        entity:
          domain: lawn_mower

set_schedule:
  name: Set mowing schedule
  description: Set the weekly mowing schedule. Only include days you want active.
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity
      required: true
      selector:
        entity:
          domain: lawn_mower
    schedule:
      name: Schedule
      description: "List of schedule entries. Each entry: {day: 1-7 (Mon-Sun), start: 'HH:MM', end: 'HH:MM', edge: true/false}"
      required: true
      example: "[{day: 2, start: '09:00', end: '12:00', edge: true}, {day: 5, start: '09:00', end: '12:00', edge: true}]"
      selector:
        object:

set_rain_delay:
  name: Set rain delay
  description: Enable or disable rain delay and set duration
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity
      required: true
      selector:
        entity:
          domain: lawn_mower
    enabled:
      name: Enabled
      description: Whether rain delay is enabled
      required: true
      selector:
        boolean:
    duration:
      name: Duration (minutes)
      description: Rain delay duration in minutes
      required: false
      default: 180
      selector:
        number:
          min: 30
          max: 720
          step: 30
          unit_of_measurement: min

add_schedule_entry:
  name: Add schedule entry
  description: Add a mowing schedule entry for a specific day
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity
      required: true
      selector:
        entity:
          domain: lawn_mower
    day:
      name: Day of week
      description: "1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday, 7=Sunday"
      required: true
      selector:
        number:
          min: 1
          max: 7
          mode: box
    start:
      name: Start time
      description: "Start time in HH:MM format"
      required: true
      selector:
        time:
    end:
      name: End time
      description: "End time in HH:MM format"
      required: true
      selector:
        time:
    edge:
      name: Edge mowing
      description: Whether to do border/edge mowing during this session
      required: false
      default: true
      selector:
        boolean:

remove_schedule_entry:
  name: Remove schedule entry
  description: Remove a mowing schedule entry for a specific day
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity
      required: true
      selector:
        entity:
          domain: lawn_mower
    day:
      name: Day of week
      description: "1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday, 7=Sunday"
      required: true
      selector:
        number:
          min: 1
          max: 7
          mode: box

clear_schedule:
  name: Clear all schedule
  description: Remove all scheduled mowing entries
  fields:
    entity_id:
      name: Entity ID
      description: The lawn mower entity
      required: true
      selector:
        entity:
          domain: lawn_mower
